name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          name=duckdbquack_${GITHUB_REF_NAME}_linux_amd64
          mkdir -p dist/$name
          go build -trimpath -ldflags "-s -w" -o dist/$name/duckdbquack  ./cmd/server
          go build -trimpath -ldflags "-s -w" -o dist/$name/quack-client ./cmd/client
          cp README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          cd dist && sha256sum $name.tar.gz > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes
